<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Playable Ad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #111; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: relative; height: 100%; max-width: calc(100vh * 9 / 16); margin: 0 auto; background: #000; overflow: hidden; }
  .layer { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  .layer.visible { opacity: 1; pointer-events: auto; }
  #video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #start { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
           background: radial-gradient(ellipse at 50% 40%, #3a2233 0%, #14090f 70%); cursor: pointer; }
  #start .play { width: 84px; height: 84px; border-radius: 50%; background: #ff9eb5; display: flex;
                 align-items: center; justify-content: center; box-shadow: 0 6px 30px rgba(255,158,181,.45); }
  #start .play::after { content: ""; margin-left: 7px; border-left: 26px solid #fff;
                        border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  #start p { color: #f4dbe4; font-size: 15px; letter-spacing: .04em; }
  #skip { position: absolute; top: 16px; right: 16px; z-index: 5; padding: 7px 16px; border: 1px solid rgba(255,255,255,.5);
          border-radius: 999px; background: rgba(0,0,0,.35); color: #fff; font-size: 13px; cursor: pointer; }
  #gameframe { width: 100%; height: 100%; border: 0; background: #fff6f2; }
  #endcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
             background: linear-gradient(160deg, #ffd9e2 0%, #fff3e0 55%, #efe0ff 100%); text-align: center; }
  #endcard img { width: 108px; height: 108px; border-radius: 24px; box-shadow: 0 10px 30px rgba(224,122,153,.35); }
  #endcard h1 { color: #b0426b; font-size: 26px; }
  #endcard a { padding: 14px 42px; border-radius: 999px; background: #ff7099; color: #fff; font-size: 17px;
               font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px rgba(255,112,153,.5); }
  #floatcta { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; display: none;
              padding: 12px 34px; border-radius: 999px; background: #ff7099; color: #fff; font-size: 15px;
              font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="stage">
  <div id="start" class="layer visible">
    <div class="play"></div>
    <p>Tap to watch</p>
  </div>
  <div id="videowrap" class="layer">
    <video id="video" playsinline preload="auto"></video>
    <button id="skip">Skip</button>
  </div>
  <div id="gamewrap" class="layer"></div>
  <div id="endcard" class="layer">
    <img id="endicon" alt="" style="display:none">
    <h1 id="endtitle"></h1>
    <a id="endcta" href="#" target="_blank" rel="noopener">Download</a>
  </div>
  <a id="floatcta" href="#" target="_blank" rel="noopener">Try it now</a>
</div>
<script>
window.PLAYABLE_CONFIG = /*INJECT*/{}/*END*/;
(function () {
  var cfg = window.PLAYABLE_CONFIG;
  var t0 = Date.now();
  var metrics = { video_started: null, video_skipped_at: null, video_completed: null,
                  game_started: null, game_completed: null, cta_clicked: null };
  function log(ev, extra) {
    metrics[ev] = (Date.now() - t0) / 1000;
    console.log("[playable]", ev, metrics[ev].toFixed(1) + "s", extra || "");
    try { parent.postMessage({ type: "playable_metric", event: ev, t: metrics[ev] }, "*"); } catch (e) {}
  }
  function show(id) {
    ["start", "videowrap", "gamewrap", "endcard"].forEach(function (l) {
      document.getElementById(l).classList.toggle("visible", l === id);
    });
  }

  var video = document.getElementById("video");
  if (cfg.has_video !== false) video.src = "bridge.mp4";
  else document.querySelector("#start p").textContent = "Tap to play";
  document.getElementById("start").addEventListener("click", function () {
    if (cfg.has_video === false) { startGame(); return; }
    show("videowrap");
    video.play();
    log("video_started");
  });
  document.getElementById("skip").addEventListener("click", function () {
    log("video_skipped_at", video.currentTime.toFixed(1) + "s of video");
    startGame();
  });
  video.addEventListener("ended", function () {
    log("video_completed");
    startGame();
  });

  var gameStarted = false;
  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    video.pause();
    var frame = document.createElement("iframe");
    frame.id = "gameframe";
    frame.allow = "autoplay";
    frame.sandbox = "allow-scripts"; // 不给 allow-same-origin，游戏内容拿到的是不透明源，接触不到容器/父页面的存储和 cookie
    frame.src = "game/index.html";
    document.getElementById("gamewrap").appendChild(frame);
    show("gamewrap");
    log("game_started");
    if (cfg.external_game) {
      setTimeout(function () {
        if (!metrics.game_completed) {
          var f = document.getElementById("floatcta");
          f.href = cfg.cta_url;
          f.style.display = "block";
        }
      }, (cfg.fallback_cta_after_s || 30) * 1000);
    }
  }

  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.type === "game_ready") log("game_ready");
    if (d.type === "game_complete") { log("game_completed"); showEnd(); }
    if (d.type === "cta_click") { log("cta_clicked"); window.open(cfg.cta_url, "_blank"); }
  });

  function showEnd() {
    var icon = document.getElementById("endicon");
    if (cfg.app_icon) { icon.src = cfg.app_icon; icon.style.display = "block"; }
    document.getElementById("endtitle").textContent = cfg.title || "";
    var cta = document.getElementById("endcta");
    cta.href = cfg.cta_url;
    cta.addEventListener("click", function () { log("cta_clicked"); });
    show("endcard");
  }
})();
</script>
</body>
</html>
